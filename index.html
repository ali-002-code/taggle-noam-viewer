const svg = document.getElementById('canvas');
const sidebar = document.getElementById('sidebar');
const tooltip = document.getElementById('tooltip');
let mode = 'simple'; // simple | detailed
let selectedEntityId = null;

function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function clearSvg() { while (svg.firstChild) svg.removeChild(svg.firstChild); }

function showTooltip(evt, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  tooltip.style.left = (evt.clientX + 14) + 'px';
  tooltip.style.top = (evt.clientY + 10) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

function edgeColor(kind) {
  if (kind === 'AGREE') return 'var(--agree)';
  if (kind === 'DISAGREE') return 'var(--disagree)';
  if (kind === 'ALIGNED') return 'var(--agree)';
  if (kind === 'DISAGREEMENT') return 'var(--disagree)';
  return 'var(--neutral)';
}

function drawLine(x1, y1, x2, y2, kind, glow, label) {
  const g = ns('g');
  if (glow) {
    const halo = ns('line');
    halo.setAttribute('x1', x1); halo.setAttribute('y1', y1);
    halo.setAttribute('x2', x2); halo.setAttribute('y2', y2);
    halo.setAttribute('stroke', edgeColor(kind));
    halo.setAttribute('stroke-width', 7);
    halo.setAttribute('stroke-opacity', 0.22);
    g.appendChild(halo);
  }
  const line = ns('line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', edgeColor(kind));
  line.setAttribute('stroke-width', glow ? 2.2 : 1.3);
  line.setAttribute('stroke-opacity', glow ? 0.95 : 0.45);
  if (!glow && kind !== 'AGREE' && kind !== 'DISAGREE' && kind !== 'ALIGNED' && kind !== 'DISAGREEMENT') {
    line.setAttribute('stroke-dasharray', '3,3');
  }
  g.appendChild(line);
  if (label) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const t = ns('text');
    t.setAttribute('x', mx); t.setAttribute('y', my - 5);
    t.setAttribute('fill', 'var(--text-dim)'); t.setAttribute('font-size', '9px');
    t.setAttribute('text-anchor', 'middle');
    t.textContent = label;
    g.appendChild(t);
  }
  svg.appendChild(g);
  return g;
}

function drawNode(x, y, r, fill, label, sub, onClick, tooltipHtml) {
  const g = ns('g');
  g.style.cursor = onClick ? 'pointer' : 'default';
  const c = ns('circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
  c.setAttribute('fill', fill);
  c.setAttribute('stroke', '#0b0d11'); c.setAttribute('stroke-width', 1.5);
  g.appendChild(c);
  if (label) {
    const t = ns('text');
    t.setAttribute('x', x); t.setAttribute('y', y + r + 14);
    t.setAttribute('fill', 'var(--text)'); t.setAttribute('font-size', '11px');
    t.setAttribute('text-anchor', 'middle');
    t.textContent = label.length > 26 ? label.slice(0, 24) + '…' : label;
    g.appendChild(t);
  }
  if (sub) {
    const t2 = ns('text');
    t2.setAttribute('x', x); t2.setAttribute('y', y + r + 27);
    t2.setAttribute('fill', 'var(--text-dim)'); t2.setAttribute('font-size', '9px');
    t2.setAttribute('text-anchor', 'middle');
    t2.textContent = sub;
    g.appendChild(t2);
  }
  if (onClick) g.addEventListener('click', onClick);
  g.addEventListener('mousemove', (e) => { if (tooltipHtml) showTooltip(e, tooltipHtml); });
  g.addEventListener('mouseleave', hideTooltip);
  svg.appendChild(g);
  return g;
}

// ---------- OVERVIEW ----------
function renderOverview() {
  clearSvg();
  const w = svg.clientWidth || 900, h = svg.clientHeight || 700;
  const noamX = w * 0.22, noamY = h * 0.5;
  const counts = DATA.recommendations.map(r => r.distinct_supporting_reviewers);
  const minC = Math.min(...counts), maxC = Math.max(...counts);
  const rScale = (v) => 10 + (maxC === minC ? 0.5 : (v - minC) / (maxC - minC)) * 14;

  const n = DATA.recommendations.length;
  const topMargin = 90, bottomMargin = 50;
  const colX = w * 0.74;
  const nodePos = (i) => {
    const y = topMargin + (i * (h - topMargin - bottomMargin)) / Math.max(1, n - 1);
    const distFromCenter = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2); // 0 at middle, 1 at ends
    const x = colX - distFromCenter * (colX - noamX) * 0.18; // gentle inward bow, evenly spaced y
    return { x, y };
  };
  DATA.recommendations.forEach((r, i) => {
    const { x, y } = nodePos(i);
    drawLine(noamX, noamY, x, y, 'structural', false, null);
  });
  DATA.recommendations.forEach((r, i) => {
    const { x, y } = nodePos(i);
    const r_ = rScale(r.distinct_supporting_reviewers);
    drawNode(x, y, r_, 'var(--destination)', `${r.rank}. ${r.title}`,
      `${r.distinct_supporting_reviewers} reviewers - ${r.network_support_tier}`,
      () => selectRecommendation(r.entity_id),
      `<b>${escapeHtml(r.title)}</b><br>Rank ${r.rank} &middot; ${r.distinct_supporting_reviewers} connected reviewers<br>Network support: ${r.network_support_tier}`);
  });
  drawNode(noamX, noamY, 30, 'var(--noam)', 'Noam', 'central user', null,
    '<b>Noam</b><br>The person Taggle is recommending for.');
  renderOverviewSidebar();
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderOverviewSidebar() {
  sidebar.innerHTML = `
    <h2>Noam's top 10</h2>
    <div class="metricLine">Click any destination restaurant to see why Taggle surfaced it.</div>
    <div class="recList">
      ${DATA.recommendations.map(r => `
        <div class="recRow" data-eid="${r.entity_id}">
          <span>${r.rank}. ${escapeHtml(r.title)}</span>
          <span class="n">${r.distinct_supporting_reviewers}&nbsp;reviewers</span>
        </div>`).join('')}
    </div>
    <div class="evidenceBlock">Node size = number of distinct reviewers connected to that restaurant through Noam's network. Bigger = more network support (not necessarily stronger taste alignment - see each restaurant's detail view).</div>
  `;
  sidebar.querySelectorAll('.recRow').forEach(el => {
    el.addEventListener('click', () => selectRecommendation(el.dataset.eid));
  });
}

// ---------- DETAIL ----------
function selectRecommendation(entityId) {
  selectedEntityId = entityId;
  renderDetail();
}

function layoutColumns(cols, w, h, marginX) {
  // cols: array of arrays of node specs; returns positions keyed by node id
  const positions = {};
  const colX = [];
  const usable = w - marginX * 2;
  cols.forEach((_, i) => colX.push(marginX + (usable * i) / Math.max(1, cols.length - 1)));
  cols.forEach((col, ci) => {
    const n = col.length;
    col.forEach((node, ri) => {
      const y = n === 1 ? h / 2 : (h * 0.12) + (ri * (h * 0.76)) / Math.max(1, n - 1);
      positions[node.id] = { x: colX[ci], y, node };
    });
  });
  return positions;
}

function renderDetail() {
  clearSvg();
  const rec = DATA.recommendations.find(r => r.entity_id === selectedEntityId);
  if (!rec) { renderOverview(); return; }
  const w = svg.clientWidth || 1000, h = Math.max(svg.clientHeight || 700, computeHeight(rec));

  // --- build node/edge model ---
  const seedNodes = new Map();   // entity_id -> {id,title,noam_rating}
  const reviewer1Nodes = new Map(); // reviewer_id -> {id, display_name}
  const bridgeNodes = new Map(); // entity_id -> title  (A<->C evidence restaurant)
  const reviewer2Nodes = new Map(); // reviewer_id -> display_name (second hop, two-hop only)
  const edges = []; // {from,to,kind,glow,label,fromCol,toCol}

  rec.one_hop_reviewers.forEach(rev => {
    reviewer1Nodes.set(rev.reviewer_id, rev.display_name || rev.reviewer_id);
    rev.shared_restaurants.forEach(sr => {
      seedNodes.set(sr.entity_id, sr.title);
      if (mode === 'detailed') {
        edges.push({ from: 'seed:' + sr.entity_id, to: 'r1:' + rev.reviewer_id,
          kind: sr.informative ? sr.alignment : 'neutral', glow: sr.informative,
          label: `Noam ${sr.noam_rating}★ / ${sr.reviewer_rating}★` });
        edges.push({ from: 'noam', to: 'seed:' + sr.entity_id, kind: 'neutral', glow: false, label: null });
      }
    });
    const bestInformative = rev.shared_restaurants.find(s => s.informative);
    edges.push({
      from: mode === 'detailed' ? 'r1:' + rev.reviewer_id : 'r1:' + rev.reviewer_id,
      to: 'dest', kind: 'neutral', glow: false,
      label: `rated ${rev.rating_of_recommendation}★`,
    });
    if (mode === 'simple') {
      edges.push({ from: 'noam', to: 'r1:' + rev.reviewer_id,
        kind: bestInformative ? bestInformative.alignment : 'neutral', glow: !!bestInformative, label: null });
    }
  });

  rec.two_hop_only_reviewers.forEach(rev => {
    const path = rev.paths[0]; // one representative path, deterministic (first by sort order)
    reviewer2Nodes.set(rev.reviewer_id, rev.display_name || rev.reviewer_id);
    if (!path) return;
    reviewer1Nodes.set(path.first_hop_reviewer_id, path.first_hop_display_name || path.first_hop_reviewer_id);
    const noamEv = path.noam_to_first_hop_evidence[0];
    const bridgeEv = path.first_hop_to_second_hop_evidence[0];
    if (mode === 'detailed') {
      if (noamEv) {
        seedNodes.set(noamEv.entity_id, noamEv.title);
        edges.push({ from: 'noam', to: 'seed:' + noamEv.entity_id, kind: 'neutral', glow: false, label: null });
        edges.push({ from: 'seed:' + noamEv.entity_id, to: 'r1:' + path.first_hop_reviewer_id,
          kind: noamEv.alignment, glow: true,
          label: `Noam ${noamEv.noam_rating}★ / ${noamEv.reviewer_rating}★` });
      }
      if (bridgeEv) {
        bridgeNodes.set(bridgeEv.entity_id, bridgeEv.title);
        edges.push({ from: 'r1:' + path.first_hop_reviewer_id, to: 'bridge:' + bridgeEv.entity_id,
          kind: 'neutral', glow: false, label: `${bridgeEv.first_hop_rating}★` });
        edges.push({ from: 'bridge:' + bridgeEv.entity_id, to: 'r2:' + rev.reviewer_id,
          kind: bridgeEv.alignment, glow: true, label: `${bridgeEv.second_hop_rating}★` });
      }
      edges.push({ from: 'r2:' + rev.reviewer_id, to: 'dest', kind: 'neutral', glow: false,
        label: `rated ${rev.rating_of_recommendation}★` });
    } else {
      edges.push({ from: 'noam', to: 'r2:' + rev.reviewer_id, kind: 'neutral', glow: false, label: null,
        dashed: true });
      edges.push({ from: 'r2:' + rev.reviewer_id, to: 'dest', kind: 'neutral', glow: false,
        label: `rated ${rev.rating_of_recommendation}★` });
    }
    if (rev.n_paths > 1) {
      edges.push({ from: 'r2:' + rev.reviewer_id, to: 'dest', note: `+${rev.n_paths - 1} more path(s)` });
    }
  });

  // --- columns ---
  const cols = mode === 'detailed'
    ? [[{ id: 'noam' }], [...seedNodes.keys()].map(id => ({ id: 'seed:' + id })),
       [...reviewer1Nodes.keys()].map(id => ({ id: 'r1:' + id })),
       [...bridgeNodes.keys()].map(id => ({ id: 'bridge:' + id })),
       [...reviewer2Nodes.keys()].map(id => ({ id: 'r2:' + id })),
       [{ id: 'dest' }]]
    : [[{ id: 'noam' }],
       [...reviewer1Nodes.keys()].map(id => ({ id: 'r1:' + id })).concat(
         [...reviewer2Nodes.keys()].map(id => ({ id: 'r2:' + id }))),
       [{ id: 'dest' }]];
  const nonEmptyCols = cols.filter(c => c.length > 0);
  const positions = layoutColumns(nonEmptyCols, w, h, 70);

  // --- draw edges first (behind nodes) ---
  edges.filter(e => !e.note).forEach(e => {
    const p1 = positions[e.from], p2 = positions[e.to];
    if (!p1 || !p2) return;
    drawLine(p1.x, p1.y, p2.x, p2.y, e.kind, e.glow, e.label);
  });

  // --- draw nodes ---
  const pNoam = positions['noam'];
  if (pNoam) drawNode(pNoam.x, pNoam.y, 24, 'var(--noam)', 'Noam', null, null, '<b>Noam</b>');

  seedNodes.forEach((title, eid) => {
    const p = positions['seed:' + eid]; if (!p) return;
    drawNode(p.x, p.y, 9, 'var(--restaurant)', title, 'acquisition seed', null,
      `<b>${escapeHtml(title)}</b><br>One of Noam's acquisition restaurants.`);
  });
  bridgeNodes.forEach((title, eid) => {
    const p = positions['bridge:' + eid]; if (!p) return;
    drawNode(p.x, p.y, 9, 'var(--restaurant)', title, 'shared restaurant', null,
      `<b>${escapeHtml(title)}</b><br>Restaurant that bridges two reviewers.`);
  });
  reviewer1Nodes.forEach((name, rid) => {
    const p = positions['r1:' + rid]; if (!p) return;
    drawNode(p.x, p.y, 11, 'var(--reviewer)', name, 'reviewer', null,
      `<b>${escapeHtml(name || rid)}</b><br>Connects to Noam.`);
  });
  reviewer2Nodes.forEach((name, rid) => {
    const p = positions['r2:' + rid]; if (!p) return;
    drawNode(p.x, p.y, 11, 'var(--reviewer)', name, 'reviewer (2nd hop)', null,
      `<b>${escapeHtml(name || rid)}</b><br>Connects indirectly, via another reviewer.`);
  });
  const pDest = positions['dest'];
  if (pDest) drawNode(pDest.x, pDest.y, 20, 'var(--destination)', rec.title, 'recommended', null,
    `<b>${escapeHtml(rec.title)}</b>`);

  // note labels for collapsed extra paths
  edges.filter(e => e.note).forEach(e => {
    const p = positions[e.to]; if (!p) return;
    const t = ns('text');
    t.setAttribute('x', p.x + 26); t.setAttribute('y', p.y + 24);
    t.setAttribute('fill', 'var(--text-dim)'); t.setAttribute('font-size', '10px');
    t.setAttribute('font-style', 'italic');
    t.textContent = e.note;
    svg.appendChild(t);
  });

  renderDetailSidebar(rec);
}

function computeHeight(rec) {
  const maxCol = Math.max(
    rec.one_hop_reviewers.length + rec.two_hop_only_reviewers.length,
    rec.one_hop_reviewers.reduce((a, r) => a + r.shared_restaurants.length, 0), 1);
  return Math.max(500, 90 + maxCol * 58);
}

function tierNarrative(rec) {
  const n = rec.distinct_supporting_reviewers;
  const totalPaths = rec.one_hop_walks + rec.two_hop_walks;
  return `Taggle surfaced <b>${escapeHtml(rec.title)}</b> because ${n} reviewer${n === 1 ? '' : 's'} connected to Noam's restaurant network also reviewed it${totalPaths ? ` (${totalPaths} connection${totalPaths === 1 ? '' : 's'} through the network overall)` : ''}.`;
}

function renderDetailSidebar(rec) {
  sidebar.innerHTML = `
    <h2>${escapeHtml(rec.title)}</h2>
    <div class="metricLine">${escapeHtml(rec.category || '')}${rec.address ? ' &middot; ' + escapeHtml(rec.address) : ''}</div>
    <div class="tierRow">
      <span class="tierPill tier-${rec.network_support_tier}">Network support: ${rec.network_support_tier}</span>
      <span class="tierPill tier-${rec.taste_evidence_tier}">Taste evidence: ${rec.taste_evidence_tier}</span>
    </div>
    <div class="narrative">${tierNarrative(rec)}</div>
    <div class="metricLine">Connected reviewers</div>
    <div class="metricBig">${rec.distinct_supporting_reviewers}</div>
    <div class="evidenceBlock">${rec.taste_evidence_note}</div>
    <details>
      <summary>Technical details</summary>
      <table class="tech">
        <tr><td class="k">Frozen rank</td><td class="v">${rec.rank}</td></tr>
        <tr><td class="k">Combined score</td><td class="v">${rec.scores.combined_score}</td></tr>
        <tr><td class="k">One-hop score (simple)</td><td class="v">${rec.scores.one_hop_simple_score}</td></tr>
        <tr><td class="k">Two-hop score (simple)</td><td class="v">${rec.scores.two_hop_simple_score}</td></tr>
        <tr><td class="k">One-hop score (evidence-weighted)</td><td class="v">${rec.scores.one_hop_evidence_score}</td></tr>
        <tr><td class="k">Two-hop score (evidence-weighted)</td><td class="v">${rec.scores.two_hop_evidence_score}</td></tr>
        <tr><td class="k">Distinct supporting reviewers</td><td class="v">${rec.distinct_supporting_reviewers}</td></tr>
        <tr><td class="k">One-hop walks</td><td class="v">${rec.one_hop_walks}</td></tr>
        <tr><td class="k">Two-hop walks</td><td class="v">${rec.two_hop_walks}</td></tr>
        <tr><td class="k">Structural graph degree</td><td class="v">${rec.structural_graph_degree}</td></tr>
        <tr><td class="k">Strongest contribution value</td><td class="v">${rec.strongest_contribution_value}</td></tr>
        <tr><td class="k">Strongest contribution reviewer</td><td class="v">${escapeHtml(rec.strongest_contribution_reviewer || '-')}</td></tr>
        <tr><td class="k">Max relationship evidence depth</td><td class="v">${rec.max_relationship_evidence_depth}</td></tr>
        <tr><td class="k">Likely chain</td><td class="v">${rec.likely_chain ? 'yes' : 'no'}</td></tr>
        <tr><td class="k">Category</td><td class="v">${escapeHtml(rec.category || '-')}</td></tr>
      </table>
    </details>
    <details>
      <summary>All ${rec.distinct_supporting_reviewers} contributing reviewers</summary>
      <div class="evidenceBlock">
        ${rec.one_hop_reviewers.map(r => `&bull; ${escapeHtml(r.display_name || r.reviewer_id)} - rated it ${r.rating_of_recommendation}★ (direct connection)`).join('<br>')}
        ${rec.one_hop_reviewers.length && rec.two_hop_only_reviewers.length ? '<br>' : ''}
        ${rec.two_hop_only_reviewers.map(r => `&bull; ${escapeHtml(r.display_name || r.reviewer_id)} - rated it ${r.rating_of_recommendation}★ (indirect, via ${r.n_paths} path${r.n_paths === 1 ? '' : 's'})`).join('<br>')}
      </div>
    </details>
    <div style="margin-top:16px"><button id="backBtn">← Back to all 10</button></div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => { selectedEntityId = null; renderOverview(); });
}

// ---------- controls ----------
document.getElementById('modeSimple').addEventListener('click', () => setMode('simple'));
document.getElementById('modeDetailed').addEventListener('click', () => setMode('detailed'));
document.getElementById('resetBtn').addEventListener('click', () => { selectedEntityId = null; renderOverview(); });

function setMode(m) {
  mode = m;
  document.getElementById('modeSimple').classList.toggle('active', m === 'simple');
  document.getElementById('modeDetailed').classList.toggle('active', m === 'detailed');
  if (selectedEntityId) renderDetail(); else renderOverview();
}

window.addEventListener('resize', () => { if (selectedEntityId) renderDetail(); else renderOverview(); });

// ---------- boot ----------
const DEFAULT_ENTITY = (DATA.recommendations.find(r => r.rank === 1) || DATA.recommendations[0]).entity_id;
selectRecommendation(DEFAULT_ENTITY);
</script>
