function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function clearSvg() { while (svg.firstChild) svg.removeChild(svg.firstChild); }

function showTooltip(evt, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  tooltip.style.left = (evt.clientX + 14) + 'px';
  tooltip.style.top = (evt.clientY + 10) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

function edgeColor(kind) {
  if (kind === 'AGREE') return 'var(--agree)';
  if (kind === 'DISAGREE') return 'var(--disagree)';
  if (kind === 'ALIGNED') return 'var(--agree)';
  if (kind === 'DISAGREEMENT') return 'var(--disagree)';
  return 'var(--neutral)';
}

function drawLine(x1, y1, x2, y2, kind, glow, label) {
  const g = ns('g');
  if (glow) {
    const halo = ns('line');
    halo.setAttribute('x1', x1); halo.setAttribute('y1', y1);
    halo.setAttribute('x2', x2); halo.setAttribute('y2', y2);
    halo.setAttribute('stroke', edgeColor(kind));
    halo.setAttribute('stroke-width', 7);
    halo.setAttribute('stroke-opacity', 0.22);
    g.appendChild(halo);
  }
  const line = ns('line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', edgeColor(kind));
  line.setAttribute('stroke-width', glow ? 2.2 : 1.3);
  line.setAttribute('stroke-opacity', glow ? 0.95 : 0.45);
  if (!glow && kind !== 'AGREE' && kind !== 'DISAGREE' && kind !== 'ALIGNED' && kind !== 'DISAGREEMENT') {
    line.setAttribute('stroke-dasharray', '3,3');
  }
  g.appendChild(line);
  if (label) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const t = ns('text');
    t.setAttribute('x', mx); t.setAttribute('y', my - 5);
    t.setAttribute('fill', 'var(--text-dim)'); t.setAttribute('font-size', '9px');
    t.setAttribute('text-anchor', 'middle');
    t.textContent = label;
    g.appendChild(t);
  }
  svg.appendChild(g);
  return g;
}

function drawNode(x, y, r, fill, label, sub, onClick, tooltipHtml) {
  const g = ns('g');
  g.style.cursor = onClick ? 'pointer' : 'default';
  const c = ns('circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
  c.setAttribute('fill', fill);
  c.setAttribute('stroke', '#0b0d11'); c.setAttribute('stroke-width', 1.5);
  g.appendChild(c);
  if (label) {
    const t = ns('text');
    t.setAttribute('x', x); t.setAttribute('y', y + r + 14);
    t.setAttribute('fill', 'var(--text)'); t.setAttribute('font-size', '11px');
    t.setAttribute('text-anchor', 'middle');
    t.textContent = label.length > 26 ? label.slice(0, 24) + '…' : label;
    g.appendChild(t);
  }
  if (sub) {
    const t2 = ns('text');
    t2.setAttribute('x', x); t2.setAttribute('y', y + r + 27);
    t2.setAttribute('fill', 'var(--text-dim)'); t2.setAttribute('font-size', '9px');
    t2.setAttribute('text-anchor', 'middle');
    t2.textContent = sub;
    g.appendChild(t2);
  }
  if (onClick) g.addEventListener('click', onClick);
  g.addEventListener('mousemove', (e) => { if (tooltipHtml) showTooltip(e, tooltipHtml); });
  g.addEventListener('mouseleave', hideTooltip);
  svg.appendChild(g);
  return g;
}

// ---------- OVERVIEW ----------
function renderOverview() {
  clearSvg();
  const w = svg.clientWidth || 900, h = svg.clientHeight || 700;
  const noamX = w * 0.22, noamY = h * 0.5;
  const counts = DATA.recommendations.map(r => r.distinct_supporting_reviewers);
  const minC = Math.min(...counts), maxC = Math.max(...counts);
  const rScale = (v) => 10 + (maxC === minC ? 0.5 : (v - minC) / (maxC - minC)) * 14;

  const n = DATA.recommendations.length;
  const topMargin = 90, bottomMargin = 50;
  const colX = w * 0.74;
  const nodePos = (i) => {
    const y = topMargin + (i * (h - topMargin - bottomMargin)) / Math.max(1, n - 1);
    const distFromCenter = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2); // 0 at middle, 1 at ends
    const x = colX - distFromCenter * (colX - noamX) * 0.18; // gentle inward bow, evenly spaced y
    return { x, y };
  };
  DATA.recommendations.forEach((r, i) => {
    const { x, y } = nodePos(i);
    drawLine(noamX, noamY, x, y, 'structural', false, null);
  });
  DATA.recommendations.forEach((r, i) => {
    const { x, y } = nodePos(i);
    const r_ = rScale(r.distinct_supporting_reviewers);
    drawNode(x, y, r_, 'var(--destination)', `${r.rank}. ${r.title}`,
      `${r.distinct_supporting_reviewers} reviewers - ${r.network_support_tier}`,
      () => selectRecommendation(r.entity_id),
      `<b>${escapeHtml(r.title)}</b><br>Rank ${r.rank} &middot; ${r.distinct_supporting_reviewers} connected reviewers<br>Network support: ${r.network_support_tier}`);
  });
  drawNode(noamX, noamY, 30, 'var(--noam)', 'Noam', 'central user', null,
    '<b>Noam</b><br>The person Taggle is recommending for.');
  renderOverviewSidebar();
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderOverviewSidebar() {
  sidebar.innerHTML = `
    <h2>Noam's top 10</h2>
    <div class="metricLine">Click any destination restaurant to see why Taggle surfaced it.</div>
    <div class="recList">
      ${DATA.recommendations.map(r => `
        <div class="recRow" data-eid="${r.entity_id}">
          <span>${r.rank}. ${escapeHtml(r.title)}</span>
          <span class="n">${r.distinct_supporting_reviewers}&nbsp;reviewers</span>
        </div>`).join('')}
    </div>
    <div class="evidenceBlock">Node size = number of distinct reviewers connected to that restaurant through Noam's network. Bigger = more network support (not necessarily stronger taste alignment - see each restaurant's detail view).</div>
  `;
  sidebar.querySelectorAll('.recRow').forEach(el => {
    el.addEventListener('click', () => selectRecommendation(el.dataset.eid));
  });
}

// ---------- DETAIL ----------
function selectRecommendation(entityId) {
  selectedEntityId = entityId;
  viewingReviewerId = null;
  renderDetail();
}

function layoutColumns(cols, w, h, marginX) {
  // cols: array of arrays of node specs; returns positions keyed by node id
  const positions = {};
  const colX = [];
  const usable = w - marginX * 2;
  cols.forEach((_, i) => colX.push(marginX + (usable * i) / Math.max(1, cols.length - 1)));
  cols.forEach((col, ci) => {
    const n = col.length;
    col.forEach((node, ri) => {
      const y = n === 1 ? h / 2 : (h * 0.12) + (ri * (h * 0.76)) / Math.max(1, n - 1);
      positions[node.id] = { x: colX[ci], y, node };
    });
  });
  return positions;
}

// Net directional sign of a two-hop path, collapsed from its two always-
// informative legs (Noam<->A and A<->C never carry neutral evidence - see
// noam_centric_recommendation_explanations.py's build logic) into ONE
// agree/disagree verdict for the hidden chain: same-signed legs reinforce
// (net AGREE), opposite-signed legs cancel (net DISAGREE). Falls back to
// neutral only if either leg is genuinely missing evidence (defensive -
// should not occur for a real two-hop entry, but never silently invents a
// taste-match where none exists).
function collapsedTwoHopAlignment(path) {
  const noamEv = path.noam_to_first_hop_evidence[0];
  const bridgeEv = path.first_hop_to_second_hop_evidence[0];
  if (!noamEv || !bridgeEv) return { informative: false, kind: 'neutral' };
  const netSign = Math.sign(path.noam_to_first_hop_signed_affinity * path.first_hop_to_second_hop_signed_affinity);
  if (netSign === 0) return { informative: false, kind: 'neutral' };
  return { informative: true, kind: netSign > 0 ? 'AGREE' : 'DISAGREE' };
}

// Pure graph-model builder - no DOM access, so it can be exercised headlessly
// (see tests/test_noam_centric_recommendation_viewer_graph_model.py). Returns
// node id -> label maps plus an edge list; renderDetail() below only turns
// this model into SVG. Enforces, by construction, that every reviewer node
// placed in SIMPLE mode's combined reviewer column has a real noam-side edge:
// a two-hop path's intermediate first-hop reviewer is added to r1Nodes ONLY
// in detailed mode (where its own real edges are also drawn); in simple mode
// the whole hidden chain collapses into a single direct noam->r2 edge whose
// colour reflects the chain's actual net alignment, never a blanket neutral.
function buildGraphModel(rec, mode) {
  const seedNodes = new Map();
  const r1Nodes = new Map();
  const bridgeNodes = new Map();
  const r2Nodes = new Map();
  const edges = [];

  rec.one_hop_reviewers.forEach(rev => {
    r1Nodes.set(rev.reviewer_id, rev.display_name || rev.reviewer_id);
    rev.shared_restaurants.forEach(sr => {
      seedNodes.set(sr.entity_id, sr.title);
      if (mode === 'detailed') {
        edges.push({ from: 'seed:' + sr.entity_id, to: 'r1:' + rev.reviewer_id,
          kind: sr.informative ? sr.alignment : 'neutral', glow: sr.informative,
          label: `Noam ${sr.noam_rating}★ / ${sr.reviewer_rating}★` });
        edges.push({ from: 'noam', to: 'seed:' + sr.entity_id, kind: 'neutral', glow: false, label: null });
      }
    });
    const bestInformative = rev.shared_restaurants.find(s => s.informative);
    edges.push({ from: 'r1:' + rev.reviewer_id, to: 'dest', kind: 'neutral', glow: false,
      label: `rated ${rev.rating_of_recommendation}★` });
    if (mode === 'simple') {
      edges.push({ from: 'noam', to: 'r1:' + rev.reviewer_id,
        kind: bestInformative ? bestInformative.alignment : 'neutral', glow: !!bestInformative, label: null });
    }
  });

  rec.two_hop_only_reviewers.forEach(rev => {
    const path = rev.paths[0]; // one representative path, deterministic (first by sort order)
    r2Nodes.set(rev.reviewer_id, rev.display_name || rev.reviewer_id);
    if (!path) return;
    const noamEv = path.noam_to_first_hop_evidence[0];
    const bridgeEv = path.first_hop_to_second_hop_evidence[0];
    if (mode === 'detailed') {
      // the bridge reviewer is only ever rendered as its own node (with its
      // own real edges) in detailed mode - never left dangling in simple mode
      r1Nodes.set(path.first_hop_reviewer_id, path.first_hop_display_name || path.first_hop_reviewer_id);
      if (noamEv) {
        seedNodes.set(noamEv.entity_id, noamEv.title);
        edges.push({ from: 'noam', to: 'seed:' + noamEv.entity_id, kind: 'neutral', glow: false, label: null });
        edges.push({ from: 'seed:' + noamEv.entity_id, to: 'r1:' + path.first_hop_reviewer_id,
          kind: noamEv.alignment, glow: true,
          label: `Noam ${noamEv.noam_rating}★ / ${noamEv.reviewer_rating}★` });
      }
      if (bridgeEv) {
        bridgeNodes.set(bridgeEv.entity_id, bridgeEv.title);
        edges.push({ from: 'r1:' + path.first_hop_reviewer_id, to: 'bridge:' + bridgeEv.entity_id,
          kind: 'neutral', glow: false, label: `${bridgeEv.first_hop_rating}★` });
        edges.push({ from: 'bridge:' + bridgeEv.entity_id, to: 'r2:' + rev.reviewer_id,
          kind: bridgeEv.alignment, glow: true, label: `${bridgeEv.second_hop_rating}★` });
      }
      edges.push({ from: 'r2:' + rev.reviewer_id, to: 'dest', kind: 'neutral', glow: false,
        label: `rated ${rev.rating_of_recommendation}★` });
    } else {
      // collapse the hidden Noam->seed->A->bridge->C chain into ONE direct
      // edge, coloured from the chain's real net alignment (never a blanket
      // neutral when informative evidence actually exists).
      const collapsed = collapsedTwoHopAlignment(path);
      edges.push({ from: 'noam', to: 'r2:' + rev.reviewer_id,
        kind: collapsed.informative ? collapsed.kind : 'neutral', glow: collapsed.informative, label: null });
      edges.push({ from: 'r2:' + rev.reviewer_id, to: 'dest', kind: 'neutral', glow: false,
        label: `rated ${rev.rating_of_recommendation}★` });
    }
    if (rev.n_paths > 1) {
      edges.push({ from: 'r2:' + rev.reviewer_id, to: 'dest', note: `+${rev.n_paths - 1} more path(s)` });
    }
  });

  return { seedNodes, r1Nodes, bridgeNodes, r2Nodes, edges };
}

// Pure role-determination for the reviewer drill-down panel - given the
// CURRENTLY SELECTED recommendation and a clicked reviewer id, returns
// exactly one role, checked in priority order (a reviewer can legitimately
// play different roles for different recommendations, so this is always
// evaluated relative to `rec`, never cached globally):
//   1. one_hop  - directly connects to Noam AND personally rated `rec`
//   2. two_hop  - personally rated `rec`, reaches Noam only via a bridge
//   3. bridge   - connects Noam to a two-hop reviewer, but is not
//                 themselves counted as having rated `rec` (see
//                 ratedRecommendationDirectly below for whether they
//                 happened to review it anyway, just not informatively)
//   4. unknown  - not part of this recommendation's graph at all (should
//                 never happen for a node the UI actually renders)
function determineReviewerRole(rec, reviewerId) {
  const oneHop = rec.one_hop_reviewers.find(e => e.reviewer_id === reviewerId);
  if (oneHop) {
    const informative = oneHop.shared_restaurants.filter(s => s.informative);
    return {
      role: 'one_hop', roleLabel: 'Direct / one-hop reviewer', displayName: oneHop.display_name,
      ratedRecommendation: oneHop.rating_of_recommendation,
      relationshipSign: informative.length ? informative[0].alignment : 'neutral',
      isInformative: informative.length > 0, evidenceDepth: informative.length,
      sharedAcquisitionRestaurants: oneHop.shared_restaurants,
      bridgeRestaurant: null, bridgeFromReviewer: null, bridgeToReviewer: null, nPaths: null,
    };
  }
  const twoHop = rec.two_hop_only_reviewers.find(e => e.reviewer_id === reviewerId);
  if (twoHop) {
    const path = twoHop.paths[0];
    const collapsed = collapsedTwoHopAlignment(path);
    return {
      role: 'two_hop', roleLabel: 'Second-hop reviewer', displayName: twoHop.display_name,
      ratedRecommendation: twoHop.rating_of_recommendation,
      relationshipSign: collapsed.informative ? collapsed.kind : 'neutral', isInformative: collapsed.informative,
      evidenceDepth: path.noam_to_first_hop_evidence.length + path.first_hop_to_second_hop_evidence.length,
      sharedAcquisitionRestaurants: [],
      bridgeRestaurant: path.first_hop_to_second_hop_evidence[0] || null,
      bridgeFromReviewer: { id: path.first_hop_reviewer_id, name: path.first_hop_display_name },
      bridgeToReviewer: null, nPaths: twoHop.n_paths,
    };
  }
  for (const entry of rec.two_hop_only_reviewers) {
    for (const path of entry.paths) {
      if (path.first_hop_reviewer_id !== reviewerId) continue;
      const ev = path.noam_to_first_hop_evidence[0];
      return {
        role: 'bridge', roleLabel: 'Bridge / first-hop reviewer', displayName: path.first_hop_display_name,
        ratedRecommendation: null, relationshipSign: ev ? ev.alignment : 'neutral', isInformative: !!ev,
        evidenceDepth: path.noam_to_first_hop_evidence.length,
        sharedAcquisitionRestaurants: path.noam_to_first_hop_evidence,
        bridgeRestaurant: path.first_hop_to_second_hop_evidence[0] || null,
        bridgeFromReviewer: null,
        bridgeToReviewer: { id: entry.reviewer_id, name: entry.display_name, rating: entry.rating_of_recommendation },
        nPaths: null,
      };
    }
  }
  return { role: 'unknown', roleLabel: 'Not connected to this recommendation', displayName: reviewerId,
    ratedRecommendation: null, relationshipSign: null, isInformative: false, evidenceDepth: 0,
    sharedAcquisitionRestaurants: [], bridgeRestaurant: null, bridgeFromReviewer: null, bridgeToReviewer: null,
    nPaths: null };
}

// Pure: every strict-restaurant interaction on record for this reviewer
// (from DATA.reviewer_histories, itself read-only from the frozen Stage 6
// graph), tagged with whether each row is the currently selected
// recommendation and/or the bridge restaurant relevant to THIS reviewer's
// role in THIS recommendation.
function buildReviewerHistoryRows(reviewerId, rec, roleInfo) {
  const store = (DATA.reviewer_histories && DATA.reviewer_histories[reviewerId]) || { history: [] };
  const bridgeEntityId = roleInfo.bridgeRestaurant ? roleInfo.bridgeRestaurant.entity_id : null;
  return store.history.map(h => ({
    ...h,
    isCurrentRecommendation: h.entity_id === rec.entity_id,
    isBridgeRestaurant: !!bridgeEntityId && h.entity_id === bridgeEntityId,
  }));
}

// Pure: applies the All/Shared/Recommendation-path/Other filter, then
// groups (A: recommendation-path rows, B: shared-with-Noam rows, C: the
// rest) before a secondary sort (rating desc, or alphabetical).
function groupAndSortHistory(rows, filter, sortMode) {
  let filtered = rows;
  if (filter === 'shared') filtered = rows.filter(r => r.shared_with_noam);
  else if (filter === 'path') filtered = rows.filter(r => r.isCurrentRecommendation || r.isBridgeRestaurant);
  else if (filter === 'other') filtered = rows.filter(r => !r.shared_with_noam && !r.isCurrentRecommendation && !r.isBridgeRestaurant);

  const groupOf = (r) => (r.isCurrentRecommendation || r.isBridgeRestaurant) ? 0 : (r.shared_with_noam ? 1 : 2);
  return [...filtered].sort((a, b) => {
    const ga = groupOf(a), gb = groupOf(b);
    if (ga !== gb) return ga - gb;
    if (sortMode === 'alpha') return a.title.localeCompare(b.title);
    return b.rating - a.rating; // 'relevance' and 'rating' both fall back to rating desc within a group
  });
}

function renderDetail() {
  clearSvg();
  const rec = DATA.recommendations.find(r => r.entity_id === selectedEntityId);
  if (!rec) { renderOverview(); return; }
  const w = svg.clientWidth || 1000, h = Math.max(svg.clientHeight || 700, computeHeight(rec));

  const { seedNodes, r1Nodes: reviewer1Nodes, bridgeNodes, r2Nodes: reviewer2Nodes, edges } = buildGraphModel(rec, mode);

  // --- columns ---
  const cols = mode === 'detailed'
    ? [[{ id: 'noam' }], [...seedNodes.keys()].map(id => ({ id: 'seed:' + id })),
       [...reviewer1Nodes.keys()].map(id => ({ id: 'r1:' + id })),
       [...bridgeNodes.keys()].map(id => ({ id: 'bridge:' + id })),
       [...reviewer2Nodes.keys()].map(id => ({ id: 'r2:' + id })),
       [{ id: 'dest' }]]
    : [[{ id: 'noam' }],
       [...reviewer1Nodes.keys()].map(id => ({ id: 'r1:' + id })).concat(
         [...reviewer2Nodes.keys()].map(id => ({ id: 'r2:' + id }))),
       [{ id: 'dest' }]];
  const nonEmptyCols = cols.filter(c => c.length > 0);
  const positions = layoutColumns(nonEmptyCols, w, h, 70);

  // --- draw edges first (behind nodes) ---
  edges.filter(e => !e.note).forEach(e => {
    const p1 = positions[e.from], p2 = positions[e.to];
    if (!p1 || !p2) return;
    drawLine(p1.x, p1.y, p2.x, p2.y, e.kind, e.glow, e.label);
  });

  // --- draw nodes ---
  const pNoam = positions['noam'];
  if (pNoam) drawNode(pNoam.x, pNoam.y, 24, 'var(--noam)', 'Noam', null, null, '<b>Noam</b>');

  seedNodes.forEach((title, eid) => {
    const p = positions['seed:' + eid]; if (!p) return;
    drawNode(p.x, p.y, 9, 'var(--restaurant)', title, 'acquisition seed', null,
      `<b>${escapeHtml(title)}</b><br>One of Noam's acquisition restaurants.`);
  });
  bridgeNodes.forEach((title, eid) => {
    const p = positions['bridge:' + eid]; if (!p) return;
    drawNode(p.x, p.y, 9, 'var(--restaurant)', title, 'shared restaurant', null,
      `<b>${escapeHtml(title)}</b><br>Restaurant that bridges two reviewers.`);
  });
  reviewer1Nodes.forEach((name, rid) => {
    const p = positions['r1:' + rid]; if (!p) return;
    drawNode(p.x, p.y, 11, 'var(--reviewer)', name, 'reviewer', () => openReviewerPanel(rid),
      `<b>${escapeHtml(name || rid)}</b><br>Connects to Noam. Click for details.`);
  });
  reviewer2Nodes.forEach((name, rid) => {
    const p = positions['r2:' + rid]; if (!p) return;
    drawNode(p.x, p.y, 11, 'var(--reviewer)', name, 'reviewer (2nd hop)', () => openReviewerPanel(rid),
      `<b>${escapeHtml(name || rid)}</b><br>Connects indirectly, via another reviewer. Click for details.`);
  });
  const pDest = positions['dest'];
  if (pDest) drawNode(pDest.x, pDest.y, 20, 'var(--destination)', rec.title, 'recommended', null,
    `<b>${escapeHtml(rec.title)}</b>`);

  // note labels for collapsed extra paths
  edges.filter(e => e.note).forEach(e => {
    const p = positions[e.to]; if (!p) return;
    const t = ns('text');
    t.setAttribute('x', p.x + 26); t.setAttribute('y', p.y + 24);
    t.setAttribute('fill', 'var(--text-dim)'); t.setAttribute('font-size', '10px');
    t.setAttribute('font-style', 'italic');
    t.textContent = e.note;
    svg.appendChild(t);
  });

  renderDetailSidebar(rec);
}

function computeHeight(rec) {
  const maxCol = Math.max(
    rec.one_hop_reviewers.length + rec.two_hop_only_reviewers.length,
    rec.one_hop_reviewers.reduce((a, r) => a + r.shared_restaurants.length, 0), 1);
  return Math.max(500, 90 + maxCol * 58);
}

function tierNarrative(rec) {
  const n = rec.distinct_supporting_reviewers;
  const totalPaths = rec.one_hop_walks + rec.two_hop_walks;
  return `Taggle surfaced <b>${escapeHtml(rec.title)}</b> because ${n} reviewer${n === 1 ? '' : 's'} connected to Noam's restaurant network also reviewed it${totalPaths ? ` (${totalPaths} connection${totalPaths === 1 ? '' : 's'} through the network overall)` : ''}.`;
}

        <tr><td class="k">Two-hop walks</td><td class="v">${rec.two_hop_walks}</td></tr>
        <tr><td class="k">Structural graph degree</td><td class="v">${rec.structural_graph_degree}</td></tr>
        <tr><td class="k">Strongest contribution value</td><td class="v">${rec.strongest_contribution_value}</td></tr>
        <tr><td class="k">Strongest contribution reviewer</td><td class="v">${escapeHtml(rec.strongest_contribution_reviewer || '-')}</td></tr>
        <tr><td class="k">Max relationship evidence depth</td><td class="v">${rec.max_relationship_evidence_depth}</td></tr>
        <tr><td class="k">Likely chain</td><td class="v">${rec.likely_chain ? 'yes' : 'no'}</td></tr>
        <tr><td class="k">Category</td><td class="v">${escapeHtml(rec.category || '-')}</td></tr>
      </table>
    </details>
    <details>
      <summary>All ${rec.distinct_supporting_reviewers} contributing reviewers</summary>
      <div class="evidenceBlock">
        ${rec.one_hop_reviewers.map(r => `&bull; ${escapeHtml(r.display_name || r.reviewer_id)} - rated it ${r.rating_of_recommendation}★ (direct connection)`).join('<br>')}
        ${rec.one_hop_reviewers.length && rec.two_hop_only_reviewers.length ? '<br>' : ''}
        ${rec.two_hop_only_reviewers.map(r => `&bull; ${escapeHtml(r.display_name || r.reviewer_id)} - rated it ${r.rating_of_recommendation}★ (indirect, via ${r.n_paths} path${r.n_paths === 1 ? '' : 's'})`).join('<br>')}
      </div>
    </details>
    <div style="margin-top:16px"><button id="backBtn">← Back to all 10</button></div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => { selectedEntityId = null; viewingReviewerId = null; renderOverview(); });
}

// ---------- reviewer drill-down panel ----------
// Opening/closing a reviewer panel never touches selectedEntityId or the
// graph itself - only the sidebar content changes, so returning to the
// recommendation always shows exactly what was selected before.
function openReviewerPanel(reviewerId) {
  viewingReviewerId = reviewerId;
  reviewerHistoryFilter = 'all';
  reviewerHistorySort = 'relevance';
  renderReviewerPanel();
}

function closeReviewerPanel() {
  viewingReviewerId = null;
  const rec = DATA.recommendations.find(r => r.entity_id === selectedEntityId);
  if (rec) renderDetailSidebar(rec);
}

function badgeRow(h) {
  const badges = [];
  if (h.isCurrentRecommendation) badges.push('<span class="tierPill tier-Strong">Current recommendation</span>');
  if (h.isBridgeRestaurant) badges.push('<span class="tierPill tier-Moderate">Bridge restaurant</span>');
  if (h.shared_with_noam) badges.push('<span class="tierPill tier-Limited">Shared with Noam</span>');
  if (h.is_acquisition_seed) badges.push('<span class="tierPill tier-Limited">Acquisition restaurant</span>');
  return badges.join(' ');
}

function reviewerConnectionNarrative(roleInfo, rec) {
  const name = escapeHtml(roleInfo.displayName || '');
  if (roleInfo.role === 'one_hop') {
    const signPhrase = roleInfo.isInformative
      ? (roleInfo.relationshipSign === 'AGREE' ? 'agrees with Noam' : 'disagrees with Noam')
      : 'has only a structural (non-informative) connection to Noam';
    return `${name} connects directly to Noam and ${signPhrase}. ${name} personally rated `
         + `<b>${escapeHtml(rec.title)}</b> ${roleInfo.ratedRecommendation}★.`;
  }
  if (roleInfo.role === 'two_hop') {
    const bridgeName = escapeHtml(roleInfo.bridgeFromReviewer ? roleInfo.bridgeFromReviewer.name : '');
    const bridgeTitle = roleInfo.bridgeRestaurant ? escapeHtml(roleInfo.bridgeRestaurant.title) : 'a shared restaurant';
    return `${name} connects to Noam indirectly, through ${bridgeName} via <b>${bridgeTitle}</b>. `
         + `${name} is the reviewer who rated <b>${escapeHtml(rec.title)}</b> ${roleInfo.ratedRecommendation}★.`
         + (roleInfo.nPaths > 1 ? ` (${roleInfo.nPaths} total paths connect this reviewer to Noam; one representative path is shown.)` : '');
  }
  if (roleInfo.role === 'bridge') {
    const toName = escapeHtml(roleInfo.bridgeToReviewer ? roleInfo.bridgeToReviewer.name : '');
    const bridgeTitle = roleInfo.bridgeRestaurant ? escapeHtml(roleInfo.bridgeRestaurant.title) : 'a shared restaurant';
    return `${name} helps connect Noam to ${toName} through <b>${bridgeTitle}</b>. ${toName} is the reviewer `
         + `who rated <b>${escapeHtml(rec.title)}</b> ${roleInfo.bridgeToReviewer ? roleInfo.bridgeToReviewer.rating : ''}★.`;
  }
  return `${name} is not part of the evidence graph for ${escapeHtml(rec.title)}.`;
}

function renderReviewerPanel() {
  const rec = DATA.recommendations.find(r => r.entity_id === selectedEntityId);
  if (!rec) return;
  const reviewerId = viewingReviewerId;
  const roleInfo = determineReviewerRole(rec, reviewerId);
  const rows = buildReviewerHistoryRows(reviewerId, rec, roleInfo);

  // bridge/first-hop reviewers are not counted as having rated the
  // recommendation by the frozen scoring - but they may still have
  // personally reviewed it (just not informatively); say so either way.
  let ownRatingNote = '';
  if (roleInfo.role === 'bridge') {
    const ownRow = rows.find(r => r.isCurrentRecommendation);
    ownRatingNote = ownRow
      ? `<div class="evidenceBlock">${escapeHtml(roleInfo.displayName)} also personally reviewed `
        + `<b>${escapeHtml(rec.title)}</b>, rating it ${ownRow.rating}★ (not counted in the frozen one-hop score).</div>`
      : `<div class="evidenceBlock">${escapeHtml(roleInfo.displayName)} did not personally review `
        + `<b>${escapeHtml(rec.title)}</b>.</div>`;
  }

  const sharedAcqHtml = roleInfo.sharedAcquisitionRestaurants.length
    ? roleInfo.sharedAcquisitionRestaurants.map(s => {
        const tag = s.informative ? (s.alignment === 'AGREE' ? 'tier-Strong' : 'tier-Moderate') : 'tier-Limited';
        const label = s.informative ? s.alignment : 'neutral';
        return `<span class="tierPill ${tag}">${escapeHtml(s.title)}: ${label}</span>`;
      }).join(' ')
    : '<span class="evidenceBlock">none</span>';

  const filtered = groupAndSortHistory(rows, reviewerHistoryFilter, reviewerHistorySort);
  const historyHtml = filtered.length ? filtered.map(h => `
      <div style="padding:7px 0;border-bottom:1px solid #1f232c;">
        <div style="display:flex;justify-content:space-between;"><b>${escapeHtml(h.title)}</b><span>${h.rating}★</span></div>
        <div class="metricLine">${escapeHtml(h.category || '')}${h.address ? ' &middot; ' + escapeHtml(h.address) : ''}</div>
        <div style="margin-top:4px;">${badgeRow(h)}</div>
      </div>`).join('')
    : '<div class="evidenceBlock">No restaurants match this filter.</div>';

  sidebar.innerHTML = `
    <h2>${escapeHtml(roleInfo.displayName)}</h2>
    <div class="metricLine">${roleInfo.roleLabel}</div>
    <div class="tierRow">
      <span class="tierPill tier-${roleInfo.isInformative ? (roleInfo.relationshipSign === 'AGREE' ? 'Strong' : 'Moderate') : 'Limited'}">
        ${roleInfo.isInformative ? roleInfo.relationshipSign : 'Structural / neutral'}
      </span>
      <span class="tierPill tier-Limited">Evidence depth: ${roleInfo.evidenceDepth}</span>
    </div>
    <div class="narrative">${reviewerConnectionNarrative(roleInfo, rec)}</div>
    ${ownRatingNote}
    <div class="metricLine" style="margin-top:12px;">Shared acquisition restaurants with Noam</div>
    <div style="margin-top:4px;">${sharedAcqHtml}</div>

    <div class="metricLine" style="margin-top:16px;">Review history (${rows.length} strict-restaurant interactions)</div>
    <div style="display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;">
      <select id="histFilter" style="flex:1;">
        <option value="all">All</option>
        <option value="shared">Shared with Noam</option>
        <option value="path">Recommendation path</option>
        <option value="other">Other restaurants</option>
      </select>
      <select id="histSort" style="flex:1;">
        <option value="relevance">Sort: relevance</option>
        <option value="rating">Sort: rating</option>
        <option value="alpha">Sort: alphabetical</option>
      </select>
    </div>
    <div id="histList" style="max-height:340px;overflow-y:auto;">${historyHtml}</div>

    <div style="margin-top:16px"><button id="backToRecBtn">← Back to ${escapeHtml(rec.title)}</button></div>
  `;
  document.getElementById('histFilter').value = reviewerHistoryFilter;
  document.getElementById('histSort').value = reviewerHistorySort;
  document.getElementById('histFilter').addEventListener('change', (e) => {
    reviewerHistoryFilter = e.target.value; renderReviewerPanel();
  });
  document.getElementById('histSort').addEventListener('change', (e) => {
    reviewerHistorySort = e.target.value; renderReviewerPanel();
  });
  document.getElementById('backToRecBtn').addEventListener('click', closeReviewerPanel);
}

// ---------- controls ----------
document.getElementById('modeSimple').addEventListener('click', () => setMode('simple'));
document.getElementById('modeDetailed').addEventListener('click', () => setMode('detailed'));
document.getElementById('resetBtn').addEventListener('click', () => { selectedEntityId = null; viewingReviewerId = null; renderOverview(); });

function setMode(m) {
  mode = m;
  viewingReviewerId = null; // the graph rebuilds on a mode switch - return to the recommendation panel
  document.getElementById('modeSimple').classList.toggle('active', m === 'simple');
  document.getElementById('modeDetailed').classList.toggle('active', m === 'detailed');
  if (selectedEntityId) renderDetail(); else renderOverview();
}

window.addEventListener('resize', () => { if (selectedEntityId) renderDetail(); else renderOverview(); });

// ---------- boot ----------
const DEFAULT_ENTITY = (DATA.recommendations.find(r => r.rank === 1) || DATA.recommendations[0]).entity_id;
selectRecommendation(DEFAULT_ENTITY);
</script>
